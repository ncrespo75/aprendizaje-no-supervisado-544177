<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f2ff">
    <title>Mi mascota virtual</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #24213a;
        background: #f5f2ff;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 2rem 1rem;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 10% 10%, #e6ddff 0, transparent 38%),
          radial-gradient(ellipse at 90% 90%, #dff8ef 0, transparent 35%),
          #f5f2ff;
      }

      button,
      input {
        font: inherit;
      }

      .pet-card {
        width: min(100%, 34rem);
        padding: clamp(1.25rem, 5vw, 2.5rem);
        border: 1px solid #e8e3f3;
        border-radius: 1.75rem;
        background: #fff;
        box-shadow: 0 1.5rem 4rem #34265b1a;
      }

      .eyebrow {
        margin: 0 0 0.4rem;
        color: #7259bd;
        font-size: 0.8rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 6vw, 2.25rem);
        letter-spacing: -0.04em;
      }

      .intro {
        margin: 0.6rem 0 1.5rem;
        color: #696579;
        line-height: 1.55;
      }

      .pet-display {
        display: grid;
        place-items: center;
        min-height: 13rem;
        margin-bottom: 1.25rem;
        overflow: hidden;
        border-radius: 1.25rem;
        background: linear-gradient(145deg, #f1ecff, #effbf6);
      }

      .pet-display img {
        width: 10rem;
        height: 10rem;
        object-fit: contain;
      }

      .pet-display img[hidden] {
        display: none;
      }

      .pet-emoji {
        font-size: 6rem;
        line-height: 1;
      }

      .pet-emoji[hidden] {
        display: none;
      }

      .name-row {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 1.25rem;
      }

      .name-row input {
        min-width: 0;
        flex: 1;
        padding: 0.7rem 0.85rem;
        border: 1px solid #dcd7e8;
        border-radius: 0.75rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      button,
      .upload-label {
        min-height: 2.75rem;
        padding: 0.65rem 0.9rem;
        border: 0;
        border-radius: 0.75rem;
        background: #6949c6;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        transition: transform 120ms ease, filter 120ms ease;
      }

      button:hover,
      .upload-label:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
      }

      button:focus-visible,
      input:focus-visible,
      .upload-label:focus-within {
        outline: 3px solid #b5a2f4;
        outline-offset: 3px;
      }

      .upload-label {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #eee9fb;
        color: #49358e;
      }

      .upload-label input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        clip-path: inset(50%);
      }

      .stats {
        display: grid;
        gap: 0.9rem;
        margin: 0;
      }

      .stat {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.35rem 0.75rem;
        align-items: center;
      }

      .stat label {
        font-weight: 650;
      }

      .stat output {
        color: #696579;
        font-variant-numeric: tabular-nums;
      }

      progress {
        grid-column: 1 / -1;
        width: 100%;
        height: 0.7rem;
        overflow: hidden;
        border: 0;
        border-radius: 1rem;
        background: #eeeaf5;
        accent-color: #7657d1;
      }

      progress::-webkit-progress-bar {
        border-radius: 1rem;
        background: #eeeaf5;
      }

      progress::-webkit-progress-value {
        border-radius: 1rem;
        background: #7657d1;
      }

      progress::-moz-progress-bar {
        border-radius: 1rem;
        background: #7657d1;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.6rem;
        margin-top: 1.5rem;
      }

      .actions button {
        padding-inline: 0.5rem;
      }

      .secondary {
        width: 100%;
        margin-top: 0.65rem;
        background: transparent;
        color: #6a6479;
      }

      .status {
        min-height: 1.5rem;
        margin: 0.85rem 0 0;
        color: #55468b;
        font-size: 0.9rem;
      }

      .note {
        margin: 1.25rem 0 0;
        color: #797487;
        font-size: 0.78rem;
        line-height: 1.5;
      }

      @media (max-width: 26rem) {
        .actions {
          grid-template-columns: 1fr;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="pet-card">
      <p class="eyebrow">Un pequeño compañero</p>
      <h1>Mi mascota virtual</h1>
      <p class="intro">Cuídala un poco cada día: dale de comer, juega con ella y ayúdala a descansar.</p>

      <div class="pet-display" aria-label="Tu mascota">
        <span class="pet-emoji" id="pet-emoji" aria-hidden="true">🐾</span>
        <img id="pet-image" alt="Imagen personalizada de tu mascota" hidden>
      </div>

      <form class="name-row" id="name-form">
        <label class="sr-only" for="pet-name">Nombre de tu mascota</label>
        <input id="pet-name" name="pet-name" maxlength="24" autocomplete="off" aria-label="Nombre de tu mascota">
        <button type="submit">Guardar nombre</button>
      </form>

      <div class="name-row">
        <label class="upload-label">
          Elegir imagen autorizada
          <input id="pet-image-upload" type="file" accept="image/*" aria-label="Elegir imagen autorizada para tu mascota">
        </label>
      </div>

      <section class="stats" aria-label="Estado de la mascota">
        <div class="stat">
          <label for="hunger">Hambre</label>
          <output id="hunger-value" for="hunger"></output>
          <progress id="hunger" max="100"></progress>
        </div>
        <div class="stat">
          <label for="happiness">Felicidad</label>
          <output id="happiness-value" for="happiness"></output>
          <progress id="happiness" max="100"></progress>
        </div>
        <div class="stat">
          <label for="energy">Energía</label>
          <output id="energy-value" for="energy"></output>
          <progress id="energy" max="100"></progress>
        </div>
      </section>

      <div class="actions" aria-label="Acciones para cuidar a tu mascota">
        <button type="button" data-action="feed">🍎 Dar de comer</button>
        <button type="button" data-action="play">🎾 Jugar</button>
        <button type="button" data-action="rest">💤 Descansar</button>
      </div>
      <button class="secondary" id="reset" type="button">Empezar de nuevo</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <p class="note">La partida se guarda en este navegador. Puedes subir una imagen propia si tienes permiso para usarla; no se incluye contenido de Pokémon.</p>
    </main>

    <script>
      const STORAGE_KEY = "mascota-virtual-v1";
      const DEFAULT_PET = {
        name: "Nube",
        hunger: 70,
        happiness: 65,
        energy: 75,
        image: "",
      };

      let pet = { ...DEFAULT_PET };
      const status = document.querySelector("#status");
      const image = document.querySelector("#pet-image");
      const emoji = document.querySelector("#pet-emoji");
      const nameInput = document.querySelector("#pet-name");

      function showStatus(message) {
        status.textContent = message;
      }

      function loadPet() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return;

          const data = JSON.parse(saved);
          if (
            typeof data !== "object" ||
            data === null ||
            typeof data.name !== "string" ||
            !["hunger", "happiness", "energy"].every(
              (key) => Number.isFinite(data[key]) && data[key] >= 0 && data[key] <= 100,
            ) ||
            typeof data.image !== "string"
          ) {
            throw new Error("Los datos guardados no tienen el formato esperado.");
          }
          pet = { ...DEFAULT_PET, ...data };
        } catch (error) {
          showStatus("No se pudo cargar la partida guardada. Puedes empezar una nueva.");
          console.error("Error al cargar la mascota:", error);
        }
      }

      function savePet() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(pet));
          return true;
        } catch (error) {
          showStatus("No se pudo guardar en este navegador. Revisa el espacio disponible.");
          console.error("Error al guardar la mascota:", error);
          return false;
        }
      }

      function render() {
        nameInput.value = pet.name;
        for (const key of ["hunger", "happiness", "energy"]) {
          document.querySelector(`#${key}`).value = pet[key];
          document.querySelector(`#${key}-value`).textContent = `${pet[key]} / 100`;
        }
        image.hidden = !pet.image;
        emoji.hidden = Boolean(pet.image);
        if (pet.image) image.src = pet.image;
      }

      function update(changes, message) {
        for (const [key, amount] of Object.entries(changes)) {
          pet[key] = Math.max(0, Math.min(100, pet[key] + amount));
        }
        render();
        if (savePet()) showStatus(message);
      }

      document.querySelector("#name-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          showStatus("Escribe un nombre antes de guardarlo.");
          nameInput.focus();
          return;
        }
        pet.name = name;
        render();
        if (savePet()) showStatus(`¡Listo! Tu mascota ahora se llama ${pet.name}.`);
      });

      document.querySelectorAll("[data-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const actions = {
            feed: [{ hunger: -25, happiness: 5 }, `¡${pet.name} disfrutó su comida!`],
            play: [{ hunger: 10, happiness: 20, energy: -15 }, `¡${pet.name} se divirtió mucho!`],
            rest: [{ hunger: 5, energy: 25 }, `${pet.name} descansó un rato.`],
          };
          const [changes, message] = actions[button.dataset.action];
          update(changes, message);
        });
      });

      document.querySelector("#pet-image-upload").addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          showStatus("Elige un archivo de imagen.");
          event.target.value = "";
          return;
        }
        if (file.size > 2 * 1024 * 1024) {
          showStatus("La imagen debe pesar 2 MB o menos.");
          event.target.value = "";
          return;
        }

        const reader = new FileReader();
        reader.addEventListener("load", () => {
          if (typeof reader.result !== "string") {
            showStatus("No se pudo leer la imagen.");
            return;
          }
          pet.image = reader.result;
          render();
          if (savePet()) showStatus("Imagen guardada para esta mascota.");
        });
        reader.addEventListener("error", () => showStatus("No se pudo leer la imagen seleccionada."));
        reader.readAsDataURL(file);
      });

      document.querySelector("#reset").addEventListener("click", () => {
        pet = { ...DEFAULT_PET };
        render();
        if (savePet()) showStatus("Empezaste una partida nueva.");
        document.querySelector("#pet-image-upload").value = "";
      });

      loadPet();
      render();
    </script>
  </body>
</html>
